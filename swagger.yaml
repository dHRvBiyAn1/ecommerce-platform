# Generated combined documentation. Edit the service-owned contracts, not this file.
openapi: 3.0.1
info:
  title: Ecommerce Platform APIs
  version: 1.0.0
  contact:
    name: Ecommerce Platform maintainers
  description: Combined documentation derived from the eight service-owned src/main/openapi/swagger.yaml contracts. Edit service inputs, then regenerate this file. Per-path servers preserve direct service access and gateway alternatives.
servers:
- url: http://localhost:8080
  description: Local API gateway
tags:
- name: 'auth: Administration'
  description: Administration operations owned by auth-service.
- name: 'auth: Authentication'
  description: Authentication operations owned by auth-service.
- name: 'auth: Discovery'
  description: Discovery operations owned by auth-service.
- name: 'auth: User profile'
  description: User profile operations owned by auth-service.
- name: 'cart: Cart'
  description: Cart and coupon application operations
- name: 'coupon: Coupons'
  description: Coupon administration, validation, and checkout lifecycle
- name: 'inventory: Inventory'
  description: Stock availability and reservation operations
- name: 'notification: Notifications'
  description: Authenticated user's notification history
- name: 'order: Orders'
  description: Customer order lifecycle and administrative status management
- name: 'payment: Payments'
  description: Payment initiation, retrieval, processing and refunds
- name: 'payment: Webhooks'
  description: Provider-signed payment event callbacks
- name: 'product: Categories'
  description: Categories operations owned by product-service.
- name: 'product: Products'
  description: Products operations owned by product-service.
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - 'auth: Discovery'
      operationId: auth_jwks
      responses:
        '200':
          description: Public RSA keys used to verify access-token signatures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_JwkSet'
        '503':
          description: When a Bearer token is present and the revocation blacklist check fails, JwtAuthFilter rejects the request with an empty response.
      summary: Get signing keys
      description: Returns public keys used by resource servers to verify JWT signatures.
    servers:
    - url: http://localhost:8081
      description: Local auth-service direct access
    - url: http://localhost:8080
      description: Local API gateway
  /api/admin/roles:
