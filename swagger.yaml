            application/json:
              schema:
                $ref: '#/components/schemas/auth_ApiResponseRole'
        '400':
          description: Invalid role name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_ErrorResponse'
        '409':
          description: Role already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_ErrorResponse'
        '401':
          description: 'Bearer-token filter rejection: revoked, non-user, or invalid-identity tokens return 401; the body may be empty, and revoked tokens may return plain text. MVC-level authentication failures use a JSON ErrorResponse.'
