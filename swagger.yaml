  /login/oauth2/code/{registrationId}:
    servers:
    - url: http://localhost:8081
      description: Local auth-service direct access
    - url: http://localhost:8080
      description: Local API gateway
    get:
      tags:
      - 'auth: Authentication'
      summary: Complete social sign-in
      description: Spring Security handles the OAuth2 authorization-code callback. On success, auth-service issues an access token and refresh token, sets the HttpOnly SameSite=Strict refresh_token cookie (Secure follows service configuration), then redirects to the configured frontend path with the access token in the URL fragment. On authentication failure, Spring Security uses its configured failure handler; this endpoint does not return a JSON error body.
      operationId: auth_completeSocialSignIn
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Browser redirect after successful login; the Location URL includes the access token in its fragment and Set-Cookie carries the refresh token.
          headers:
            Location:
              description: Configured frontend redirect URL with the access token in the fragment.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: HttpOnly, SameSite=Strict refresh_token cookie; Secure follows service configuration.
              schema:
                type: string
  /oauth2/authorization/{registrationId}:
    servers:
    - url: http://localhost:8081
      description: Local auth-service direct access
    - url: http://localhost:8080
      description: Local API gateway
    get:
      tags:
      - 'auth: Authentication'
      summary: Start social sign-in
      description: Redirects the browser to a configured OAuth2 provider. Google and GitHub are available only when configured; otherwise the route is not installed.
      operationId: auth_startSocialSignIn
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      responses:
        '302':
          description: Redirect to the configured identity provider.
          headers:
            Location:
              description: Provider authorization URL.
              schema:
                type: string
                format: uri
        '404':
          description: Provider is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_ErrorResponse'
components:
  schemas:
    auth_AddressDto:
      required:
      - city
      - country
      - fullName
      - phone
      - state
      - street
      - zipCode
      type: object
      properties:
        fullName:
          maxLength: 120
          type: string
          x-not-null-message: Full name is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Full name is required")'
          x-size-message: Full name must not exceed 120 characters
          x-jackson-json-include-policy: ALWAYS
        phone:
          pattern: ^\+?[0-9 ()-]{6,20}$
          type: string
          x-not-null-message: Phone number is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Phone number is required")'
          x-pattern-message: Invalid phone number
          x-jackson-json-include-policy: ALWAYS
        street:
          maxLength: 200
          type: string
          x-not-null-message: Street address is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Street address is required")'
          x-size-message: Street address must not exceed 200 characters
          x-jackson-json-include-policy: ALWAYS
        city:
          maxLength: 80
          type: string
          x-not-null-message: City is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "City is required")'
          x-size-message: City must not exceed 80 characters
          x-jackson-json-include-policy: ALWAYS
        state:
          maxLength: 80
          type: string
          x-not-null-message: State/Province is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "State/Province is required")'
          x-size-message: State must not exceed 80 characters
          x-jackson-json-include-policy: ALWAYS
        zipCode:
          maxLength: 20
          type: string
          x-not-null-message: Zip/Postal code is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Zip/Postal code is required")'
          x-size-message: Zip code must not exceed 20 characters
          x-jackson-json-include-policy: ALWAYS
        country:
          maxLength: 80
          type: string
          x-not-null-message: Country is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Country is required")'
          x-size-message: Country must not exceed 80 characters
          x-jackson-json-include-policy: ALWAYS
    auth_ApiResponseListRole:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
