                $ref: '#/components/schemas/auth_ApiResponseListRole'
        '401':
          description: 'Bearer-token filter rejection: revoked, non-user, or invalid-identity tokens return 401; the body may be empty, and revoked tokens may return plain text. MVC-level authentication failures use a JSON ErrorResponse.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_ErrorResponse'
            text/plain:
              schema:
                type: string
        '403':
          description: 'Security denial: anonymous requests receive 403 with an empty body when OAuth2 login is disabled, and callers without permission receive 403. With OAuth2 login enabled and a provider configured, anonymous access may instead redirect to sign-in (302). MVC-level authorization failures use a JSON ErrorResponse.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_ErrorResponse'
        '302':
          description: Conditional sign-in redirect when OAuth2 login is enabled and a provider is configured; otherwise anonymous protected requests receive 403.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          description: When a Bearer token is present and the revocation blacklist check fails, JwtAuthFilter rejects the request with an empty response.
      summary: List roles
      description: Returns configured roles.
      security:
      - auth_bearerAuth: []
    post:
      tags:
      - 'auth: Administration'
      operationId: auth_createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_CreateRoleRequest'
        required: true
      responses:
        '201':
          description: Role created.
