  /api/v1/payments/webhook:
    post:
      operationId: payment_receiveInternalPaymentWebhook
      summary: Receive an internal HMAC-signed webhook
      parameters:
      - name: X-Webhook-Signature
        in: header
        required: true
        description: HMAC-SHA256 of <unix-seconds>.<exact raw HTTP body bytes>, formatted t=<unix-seconds>,v1=<hex-hmac>. Verified with PAYMENT_WEBHOOK_SECRET and configured timestamp tolerance.
        schema:
          type: string
          pattern: ^t=[0-9]+,v1=[0-9a-fA-F]+$
      responses:
        '200':
          description: Verified event accepted; empty body
        '400':
          description: Invalid JSON or webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment_ErrorResponse'
        '401':
          description: Signature missing, expired, or invalid.
        '503':
          description: Webhook secret is unavailable.
      description: Public webhook endpoint. The JSON object is parsed as PaymentWebhookRequest, but X-Webhook-Signature is verified against the exact raw UTF-8 body bytes before parsing; do not parse or reserialize the body before signature verification. The HMAC input is <unix-seconds>.<raw-body>. This HMAC signature format is separate from Stripe-Signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/payment_PaymentWebhookRequest'
      tags:
      - 'payment: Webhooks'
    servers:
    - url: http://localhost:8085
      description: Direct service API
    - url: http://localhost:8080
      description: API gateway
  /api/v1/payments/webhook/stripe:
    post:
      operationId: payment_receiveStripeWebhook
      summary: Receive a Stripe webhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        description: Stripe-generated signature header verified by the Stripe SDK using the configured webhook signing secret.
        schema:
          type: string
      responses:
        '200':
          description: Verified supported Stripe event accepted; empty body
        '400':
          description: Stripe signature invalid, payload invalid, or event unsupported.
        '503':
          description: Stripe webhook secret is unavailable.
      description: Public Stripe webhook endpoint. Preserve the exact raw request body bytes and forward them unchanged to Stripe signature verification. Only payment_intent.succeeded and payment_intent.payment_failed events with a valid PaymentIntent and paymentReference metadata are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Stripe Event JSON. Preserve and verify the exact raw request body bytes before parsing.
      tags:
      - 'payment: Webhooks'
    servers:
    - url: http://localhost:8085
      description: Direct service API
    - url: http://localhost:8080
