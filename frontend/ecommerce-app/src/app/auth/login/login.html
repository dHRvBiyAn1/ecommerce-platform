<div class="auth-page">
  <div class="auth-card">
    <!-- Brand header -->
    <div class="auth-header">
      <div class="brand-icon">
        <app-icon name="brand" [size]="32"></app-icon>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your ShopVerse account</p>
    </div>

    <!-- Login form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <app-input
        id="login-email"
        label="Email address"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        formControlName="email"
        [hasError]="!!(loginForm.get('email')?.invalid && loginForm.get('email')?.touched)"
        [errorMessage]="
          loginForm.get('email')?.errors?.['required']
            ? 'Email is required'
            : loginForm.get('email')?.errors?.['email']
              ? 'Please enter a valid email address'
              : ''
        "
      >
        <app-icon icon name="mail" [size]="18"></app-icon>
      </app-input>

      <app-input
        id="login-password"
        label="Password"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        formControlName="password"
        [hasError]="!!(loginForm.get('password')?.invalid && loginForm.get('password')?.touched)"
        [errorMessage]="
          loginForm.get('password')?.errors?.['required']
            ? 'Password is required'
            : loginForm.get('password')?.errors?.['minlength']
              ? 'Password must be at least 6 characters'
              : ''
        "
      >
        <app-icon icon name="lock" [size]="18"></app-icon>
      </app-input>

      <app-button type="submit" text="Sign In" [loading]="loading" loadingText="Signing in…">
        <app-icon icon name="arrow-right" [size]="18" customClass="btn-icon"></app-icon>
      </app-button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
