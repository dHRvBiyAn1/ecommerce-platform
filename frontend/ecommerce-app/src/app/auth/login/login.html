<div class="auth-page">
  <div class="auth-card">
    <!-- Brand header -->
    <div class="auth-header">
      <div class="brand-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 01-8 0" />
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your ShopVerse account</p>
    </div>

    <!-- Login form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <app-input
        id="login-email"
        label="Email address"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        formControlName="email"
        [hasError]="!!(loginForm.get('email')?.invalid && loginForm.get('email')?.touched)"
        [errorMessage]="
          loginForm.get('email')?.errors?.['required']
            ? 'Email is required'
            : loginForm.get('email')?.errors?.['email']
              ? 'Please enter a valid email address'
              : ''
        "
      >
        <svg icon viewBox="0 0 20 20" fill="currentColor">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
        </svg>
      </app-input>

      <app-input
        id="login-password"
        label="Password"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        formControlName="password"
        [hasError]="!!(loginForm.get('password')?.invalid && loginForm.get('password')?.touched)"
        [errorMessage]="
          loginForm.get('password')?.errors?.['required']
            ? 'Password is required'
            : loginForm.get('password')?.errors?.['minlength']
              ? 'Password must be at least 6 characters'
              : ''
        "
      >
        <svg icon viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
            clip-rule="evenodd"
          />
        </svg>
      </app-input>

      <app-button type="submit" text="Sign In" [loading]="loading" loadingText="Signing in…">
        <svg icon viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
          <path
            fill-rule="evenodd"
            d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </app-button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
