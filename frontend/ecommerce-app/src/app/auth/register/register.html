<div class="auth-page">
  <div class="auth-card">
    <!-- Success state -->
    @if (success) {
      <div class="success-state">
        <div class="success-icon">
          <app-icon name="check-circle" [size]="48"></app-icon>
        </div>
        <h2>Account Created!</h2>
        <p>
          We've sent a verification link to your email address. Please check your inbox and verify
          your account before signing in.
        </p>
        <a
          routerLink="/login"
          class="btn btn-primary"
          style="margin-top: 16px; text-decoration: none"
        >
          <span>Go to Sign In</span>
          <app-icon icon name="arrow-right" [size]="18" customClass="btn-icon"></app-icon>
        </a>
      </div>
    } @else {
      <!-- Brand header -->
      <div class="auth-header">
        <div class="brand-icon">
          <app-icon name="user" [size]="32"></app-icon>
        </div>
        <h1>Create your account</h1>
        <p>Join ShopVerse and start shopping</p>
      </div>

      <!-- Register form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <div class="name-row">
          <!-- First name -->
          <app-input
            id="reg-firstname"
            label="First name"
            type="text"
            placeholder="John"
            autocomplete="given-name"
            formControlName="firstName"
            [hasError]="
              !!(registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched)
            "
            errorMessage="First name is required"
          >
            <svg icon viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                clip-rule="evenodd"
              />
            </svg>
          </app-input>

          <!-- Last name -->
          <app-input
            id="reg-lastname"
            label="Last name"
            type="text"
            placeholder="Doe"
            autocomplete="family-name"
            formControlName="lastName"
          >
            <app-icon icon name="user" [size]="18"></app-icon>
          </app-input>
        </div>

        <!-- Email field -->
        <app-input
          id="reg-email"
          label="Email address"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          formControlName="email"
          [hasError]="!!(registerForm.get('email')?.invalid && registerForm.get('email')?.touched)"
          [errorMessage]="
            registerForm.get('email')?.errors?.['required']
              ? 'Email is required'
              : registerForm.get('email')?.errors?.['email']
                ? 'Please enter a valid email address'
                : ''
          "
        >
          <app-icon icon name="mail" [size]="18"></app-icon>
        </app-input>

        <!-- Password field -->
        <app-input
          id="reg-password"
          label="Password"
          type="password"
          placeholder="Min. 6 characters"
          autocomplete="new-password"
          formControlName="password"
          [hasError]="
            !!(registerForm.get('password')?.invalid && registerForm.get('password')?.touched)
          "
          [errorMessage]="
            registerForm.get('password')?.errors?.['required']
              ? 'Password is required'
              : registerForm.get('password')?.errors?.['minlength']
                ? 'Password must be at least 6 characters'
                : ''
          "
        >
          <app-icon icon name="lock" [size]="18"></app-icon>
        </app-input>

        <input type="hidden" formControlName="role" />

        <!-- Submit button -->
        <app-button
          type="submit"
          text="Create Account"
          [loading]="loading"
          loadingText="Creating account…"
        >
          <app-icon icon name="arrow-right" [size]="18" customClass="btn-icon"></app-icon>
        </app-button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    }
  </div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
