<div class="auth-page">
  <div class="auth-card">
    <!-- Success state -->
    @if (success) {
      <div class="success-state">
        <div class="success-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
        </div>
        <h2>Account Created!</h2>
        <p>
          We've sent a verification link to your email address. Please check your inbox and verify
          your account before signing in.
        </p>
        <a
          routerLink="/login"
          class="btn btn-primary"
          style="margin-top: 16px; text-decoration: none"
        >
          <span>Go to Sign In</span>
          <svg viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
            <path
              fill-rule="evenodd"
              d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
      </div>
    } @else {
      <!-- Brand header -->
      <div class="auth-header">
        <div class="brand-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
        </div>
        <h1>Create your account</h1>
        <p>Join ShopVerse and start shopping</p>
      </div>

      <!-- Register form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <div class="name-row">
          <!-- First name -->
          <app-input
            id="reg-firstname"
            label="First name"
            type="text"
            placeholder="John"
            autocomplete="given-name"
            formControlName="firstName"
            [hasError]="
              !!(registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched)
            "
            errorMessage="First name is required"
          >
            <svg icon viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                clip-rule="evenodd"
              />
            </svg>
          </app-input>

          <!-- Last name -->
          <app-input
            id="reg-lastname"
            label="Last name"
            type="text"
            placeholder="Doe"
            autocomplete="family-name"
            formControlName="lastName"
          >
            <svg icon viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                clip-rule="evenodd"
              />
            </svg>
          </app-input>
        </div>

        <!-- Email field -->
        <app-input
          id="reg-email"
          label="Email address"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          formControlName="email"
          [hasError]="!!(registerForm.get('email')?.invalid && registerForm.get('email')?.touched)"
          [errorMessage]="
            registerForm.get('email')?.errors?.['required']
              ? 'Email is required'
              : registerForm.get('email')?.errors?.['email']
                ? 'Please enter a valid email address'
                : ''
          "
        >
          <svg icon viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
        </app-input>

        <!-- Password field -->
        <app-input
          id="reg-password"
          label="Password"
          type="password"
          placeholder="Min. 6 characters"
          autocomplete="new-password"
          formControlName="password"
          [hasError]="
            !!(registerForm.get('password')?.invalid && registerForm.get('password')?.touched)
          "
          [errorMessage]="
            registerForm.get('password')?.errors?.['required']
              ? 'Password is required'
              : registerForm.get('password')?.errors?.['minlength']
                ? 'Password must be at least 6 characters'
                : ''
          "
        >
          <svg icon viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
              clip-rule="evenodd"
            />
          </svg>
        </app-input>

        <input type="hidden" formControlName="role" />

        <!-- Submit button -->
        <app-button
          type="submit"
          text="Create Account"
          [loading]="loading"
          loadingText="Creating account…"
        >
          <svg icon viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
            <path
              fill-rule="evenodd"
              d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </app-button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    }
  </div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
