<app-page-header
  title="Products"
  subtitle="Track your store's progress to boost your sales."
  [breadcrumbs]="breadcrumbs"
></app-page-header>
<div class="mb-2">
  <app-card>
    <!-- Table Header Actions (Filter / Search) -->
    <div class="table-actions">
      <div class="search-box">
        <app-icon name="search"></app-icon>
        <input type="text" placeholder="Search..." />
      </div>
      <div class="table-toolbar">
        <button class="btn btn-outline filter-btn">
          <app-icon name="filter"></app-icon>
          Filter
        </button>
        <button class="btn btn-outline" (click)="exportProducts()">
          <app-icon name="download"></app-icon>
          Export
        </button>
        <button class="btn btn-primary" routerLink="/admin/add-product">
          <app-icon name="plus"></app-icon>
          Add Product
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="grid-table">
        <thead>
          <tr>
            <th class="w-checkbox">
              <input type="checkbox" [checked]="allSelected" (change)="toggleAll($event)" />
            </th>
            <th (click)="sort('name')" class="sortable" [class.active-sort]="sortColumn === 'name'">
              Products
              <app-icon name="sort" class="sort-icon" [class.desc]="sortColumn === 'name' && sortDirection === 'desc'"></app-icon>
            </th>
            <th
              (click)="sort('category')"
              class="sortable"
              [class.active-sort]="sortColumn === 'category'"
            >
              Category
              <app-icon name="sort" class="sort-icon" [class.desc]="sortColumn === 'category' && sortDirection === 'desc'"></app-icon>
            </th>
            <th
              (click)="sort('brand')"
              class="sortable"
              [class.active-sort]="sortColumn === 'brand'"
            >
              Brand
              <app-icon name="sort" class="sort-icon" [class.desc]="sortColumn === 'brand' && sortDirection === 'desc'"></app-icon>
            </th>
            <th
              (click)="sort('price')"
              class="sortable"
              [class.active-sort]="sortColumn === 'price'"
            >
              Price
              <app-icon name="sort" class="sort-icon" [class.desc]="sortColumn === 'price' && sortDirection === 'desc'"></app-icon>
            </th>
            <th>Stock</th>
            <th
              (click)="sort('createdAt')"
              class="sortable"
              [class.active-sort]="sortColumn === 'createdAt'"
            >
              Created At
              <app-icon name="sort" class="sort-icon" [class.desc]="sortColumn === 'createdAt' && sortDirection === 'desc'"></app-icon>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (prod of products; track prod.id) {
            <tr>
              <td>
                <input type="checkbox" [(ngModel)]="prod.selected" (change)="onProductSelect()" />
              </td>
              <td>
                <div class="product-cell">
                  <div class="product-img"></div>
                  <span class="product-name">{{ prod.name }}</span>
                </div>
              </td>
              <td class="text-muted">{{ prod.category }}</td>
              <td class="text-muted">{{ prod.brand }}</td>
              <td class="font-medium">{{ prod.price | currency: 'USD' }}</td>
              <td>
                <app-badge [variant]="prod.inStock ? 'success' : 'error'">
                  {{ prod.inStock ? 'In Stock' : 'Out of Stock' }}
                </app-badge>
              </td>
              <td class="text-muted">{{ prod.createdAt }}</td>
              <td class="actions-cell">
                <button class="dots-btn">
                  <app-icon name="dots"></app-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <app-pagination 
      [totalItems]="products.length" 
      [itemsPerPage]="itemsPerPage" 
      [currentPage]="currentPage" 
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </app-card>
</div>
