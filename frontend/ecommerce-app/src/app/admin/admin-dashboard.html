<app-admin-layout>
  <div class="dashboard-grid">
    <!-- Top KPI Cards -->
    <div class="top-row">
      <app-stat-card
        title="Customers"
        value="3,782"
        trend="+ 11.01%"
        trendType="up"
        iconBgClass="bg-primary"
      >
        <svg
          icon
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </app-stat-card>

      <app-stat-card
        title="Orders"
        value="5,359"
        trend="↓ 9.05%"
        trendType="down"
        iconBgClass="bg-success"
      >
        <svg
          icon
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
          ></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </app-stat-card>
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <div class="span-2">
        <app-card>
          <app-chart-card title="Monthly Sales" type="bar">
            <button actions class="dots-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
              </svg>
            </button>
          </app-chart-card>
        </app-card>
      </div>

      <div class="span-1">
        <app-card>
          <app-chart-card
            title="Monthly Target"
            subtitle="Target you've set for each month"
            type="radial"
          >
            <button actions class="dots-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
              </svg>
            </button>
          </app-chart-card>
        </app-card>
      </div>
    </div>

    <!-- Statistics Full Width -->
    <div class="full-row">
      <app-card>
        <app-chart-card title="Statistics" subtitle="Target you've set for each month" type="area">
          <div actions class="chart-filters">
            <button class="filter-btn active">Overview</button>
            <button class="filter-btn">Sales</button>
            <button class="filter-btn">Revenue</button>
            <button class="filter-btn date-range">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              Mar 4 - Mar 10
            </button>
          </div>
        </app-chart-card>
      </app-card>
    </div>

    <!-- Bottom Row (Demographics & Recent Orders placeholder) -->
    <div class="bottom-row">
      <div class="span-1">
        <app-card title="Customers Demographic">
          <button actions class="dots-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
          <p style="color: var(--color-text-muted); font-size: 0.875rem">
            Number of customer based on country
          </p>
          <div class="map-placeholder">
            <!-- Simulated map visual -->
            <svg viewBox="0 0 100 50" style="width: 100%; height: 100%; opacity: 0.2">
              <path
                d="M10,20 Q20,10 30,25 T50,20 T70,30 T90,15"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </div>
        </app-card>
      </div>

      <div class="span-2">
        <app-card title="Recent Orders">
          <div actions style="display: flex; gap: 8px">
            <button class="filter-btn">
              <svg
                style="width: 14px; height: 14px; margin-right: 4px"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg
              >Filter
            </button>
            <button class="filter-btn">See all</button>
          </div>

          <table class="frontend-table mt-4">
            <thead>
              <tr>
                <th>Products</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <div
                      style="
                        width: 32px;
                        height: 32px;
                        background: rgba(255, 255, 255, 0.1);
                        border-radius: 4px;
                      "
                    ></div>
                    <div style="display: flex; flex-direction: column">
                      <span style="font-weight: 500">Macbook pro 13"</span>
                      <span style="font-size: 0.75rem; color: var(--color-text-muted)"
                        >2 Variants</span
                      >
                    </div>
                  </div>
                </td>
                <td style="color: var(--color-text-muted)">Laptop</td>
                <td style="font-weight: 500">$2399.00</td>
                <td>
                  <span style="color: var(--color-success); font-weight: 500; font-size: 0.85rem"
                    >Delivered</span
                  >
                </td>
              </tr>
              <tr>
                <td>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <div
                      style="
                        width: 32px;
                        height: 32px;
                        background: rgba(255, 255, 255, 0.1);
                        border-radius: 4px;
                      "
                    ></div>
                    <div style="display: flex; flex-direction: column">
                      <span style="font-weight: 500">Apple Watch 7</span>
                      <span style="font-size: 0.75rem; color: var(--color-text-muted)"
                        >1 Variant</span
                      >
                    </div>
                  </div>
                </td>
                <td style="color: var(--color-text-muted)">Watch</td>
                <td style="font-weight: 500">$399.00</td>
                <td>
                  <span style="color: var(--color-success); font-weight: 500; font-size: 0.85rem"
                    >Delivered</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </app-card>
      </div>
    </div>
  </div>
</app-admin-layout>
