<header class="header">
  <div class="header-left">
    <button class="icon-btn sidebar-toggle" (click)="toggleSidebar()">
      <app-icon name="menu"></app-icon>
    </button>
  
    <!-- Search -->
    <div class="search-bar">
      <app-icon name="search" customClass="search-icon"></app-icon>
      <input #searchInput type="text" placeholder="Search or type command..." />
      <span class="shortcut">⌘K</span>
    </div>
  </div>

  <div class="actions">
    <!-- Theme Toggle -->
    <button class="icon-btn" (click)="toggleTheme()">
      @if ((theme$ | async) === 'dark') {
        <app-icon name="moon"></app-icon>
      } @else {
        <app-icon name="sun"></app-icon>
      }
    </button>

    <!-- Notifications -->
    <button class="icon-btn notification-btn">
      <app-icon name="bell"></app-icon>
      <span class="indicator"></span>
    </button>

    <!-- User Profile Dropdown Placeholder -->
    <div class="user-profile">
      <div class="avatar">
        <span>JD</span>
      </div>
      <div class="user-info">
        <span class="name">John Doe</span>
        <app-icon name="chevron-down" customClass="chevron"></app-icon>
      </div>
    </div>
  </div>
</header>
