<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <app-icon name="brand"></app-icon>
      </div>
      <h2>ShopVerse</h2>
    </div>
  </div>

  <nav class="sidebar-nav">
    <!-- Menu Section -->
    <div class="nav-section">
      <h3 class="nav-section-title">MENU</h3>

      <!-- Dashboard Dropdown -->
      <div class="nav-group" [class.open]="isDashboardOpen">
        <a class="nav-item" (click)="toggleDashboard()" [class.active]="isDashboardOpen">
          <app-icon name="dashboard" customClass="nav-icon"></app-icon>
          <span>Dashboard</span>
          <app-icon name="chevron-down" customClass="chevron"></app-icon>
        </a>
        <div class="nav-sub">
          <a
            routerLink="/admin"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-subitem"
          >
            eCommerce
          </a>
          <a routerLink="/admin/products" routerLinkActive="active" class="nav-subitem">
            Products
          </a>
          <a routerLink="/admin/add-product" routerLinkActive="active" class="nav-subitem">
            Add Product
          </a>
        </div>
      </div>

      <a href="#" class="nav-item">
        <app-icon name="analytics" customClass="nav-icon"></app-icon>
        <span>Analytics</span>
      </a>

      <a href="#" class="nav-item">
        <app-icon name="marketing" customClass="nav-icon"></app-icon>
        <span>Marketing</span>
      </a>

      <a href="#" class="nav-item">
        <app-icon name="users" customClass="nav-icon"></app-icon>
        <span>CRM</span>
      </a>

      <!-- Other tools -->
      <a href="#" class="nav-item">
        <app-icon name="calendar" customClass="nav-icon"></app-icon>
        <span>Calendar</span>
      </a>

      <a href="#" class="nav-item">
        <app-icon name="user" customClass="nav-icon"></app-icon>
        <span>User Profile</span>
      </a>
    </div>

    <!-- Support Section -->
    <div class="nav-section">
      <h3 class="nav-section-title">SUPPORT</h3>

      <a href="#" class="nav-item">
        <app-icon name="chat" customClass="nav-icon"></app-icon>
        <span>Chat</span>
      </a>

      <a href="#" class="nav-item">
        <app-icon name="ticket" customClass="nav-icon"></app-icon>
        <span>Support Ticket</span>
        <span class="badge new">NEW</span>
        <app-icon name="chevron-right" customClass="chevron"></app-icon>
      </a>
    </div>
  </nav>
</aside>
