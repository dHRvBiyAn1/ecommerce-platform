<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Admin Dashboard</h2>
    <p class="text-surface-500 mt-1">Overview of platform metrics and activity</p>
  </div>

  @for (stat of stats; track stat.label) {
    <div class="col-span-12 sm:col-span-6 lg:col-span-3">
      <div class="bg-surface-0 dark:bg-surface-900 rounded-xl shadow-sm border border-surface-200 dark:border-surface-700 p-6">
        <div class="flex items-center justify-between mb-4">
          <span class="text-surface-500 text-sm font-medium">{{ stat.label }}</span>
          <div class="w-10 h-10 rounded-lg bg-primary-50 dark:bg-primary-950/30 flex items-center justify-center">
            <i class="pi {{ stat.icon }} text-primary"></i>
          </div>
        </div>
        <p class="text-3xl font-bold text-surface-900 dark:text-surface-0">{{ stat.value }}</p>
        <span class="text-xs text-surface-400">{{ stat.change }}</span>
      </div>
    </div>
  }

  <div class="col-span-12 lg:col-span-8">
    <p-card header="Revenue">
      <div style="height: 300px">
        <p-chart type="line" [data]="chartData" [options]="chartOptions"></p-chart>
      </div>
    </p-card>
  </div>

  <div class="col-span-12 lg:col-span-4">
    <p-card header="Recent Sales">
      <div class="overflow-x-auto">
      <p-table [value]="recentSales" [tableStyle]="{ 'min-width': '100%' }" [responsiveLayout]="'stack'" [breakpoint]="'768px'">
        <ng-template pTemplate="body" let-sale>
          <tr>
            <td class="font-medium">{{ sale.name }}</td>
            <td>{{ sale.price }}</td>
            <td><span class="text-surface-500 text-sm">{{ sale.status }}</span></td>
          </tr>
        </ng-template>
      </p-table>
      </div>
    </p-card>
  </div>
</div>
