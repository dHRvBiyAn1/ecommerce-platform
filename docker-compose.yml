# ============================================================================
# Local development stack with comprehensive service orchestration health checks.
# Bring up from the repo root:
#   docker compose up -d
# ============================================================================

# --- Shared Configurations (Anchors) ---
x-shared-network: &shared-network
  networks:
    - ecommerce-network

# Combined network and resource constraints for Spring Boot services
x-backend-defaults: &backend-defaults
  networks:
    - ecommerce-network
  deploy:
    resources:
      limits:
        memory: 768M
      reservations:
        memory: 256M
  restart: unless-stopped

services:
  # ---------- Datastores ----------
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    container_name: postgres
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0@sha256:4b5bf3c2bb7516164f6dcb44acce4fdcb428abfe5771a1128304a0f34ab9ff7c
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    <<: *shared-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok || quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["6379:6379"]
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    <<: *shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0@sha256:076ffdc200a51895a220a3c5f4692c73bd6d192ad6bd8db641ded4d2114c7e7b
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  kafka:
    image: confluentinc/cp-kafka:7.9.6@sha256:9e178783dba8cf44cd8b1d260f548a587a21235921957edd4ed7aa7d060b0852
    container_name: kafka
    # Two listeners on distinct ports:
    #   9092  → PLAINTEXT (internal, used by other containers via kafka:9092)
    #   29092 → PLAINTEXT_HOST (host-facing, mapped so tools on your laptop can connect)
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OPTS: "-Xms512M -Xmx512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-init:
    image: confluentinc/cp-kafka:7.9.6@sha256:9e178783dba8cf44cd8b1d260f548a587a21235921957edd4ed7aa7d060b0852
    container_name: kafka-init
    # FIX: set restart: "no" so the container doesn't restart after its one-shot
    # topic-creation script exits successfully.
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint:
      - bash
      - -c
      - |
        for topic in user-events product-events order-events inventory-events \
                     payment-events notification-events cart-events review-events \
                     coupon-events shipping-events audit-events; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic.DLT" --partitions 3 --replication-factor 1
        done
        echo "Kafka topics ready"
    <<: *shared-network

  # ---------- Platform infra services ----------

  discovery-server:
    build: {context: ., dockerfile: services/discovery-server/Dockerfile}
    container_name: discovery-server
    ports: ["8761:8761"]
    environment:
      PORT: 8761
    # FIX: YAML only allows one `<<:` merge key per mapping. Inline both anchors'
    # contents directly rather than using two separate merge keys (the second `<<:`
    # silently overwrites the first in the YAML 1.1 merge key spec).
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  config-server:
    build: {context: ., dockerfile: services/config-server/Dockerfile}
    container_name: config-server
    ports: ["8888:8888"]
    environment:
      PORT: 8888
      SPRING_PROFILES_ACTIVE: native,${SPRING_PROFILES_ACTIVE}
    depends_on:
      discovery-server: {condition: service_healthy}
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  api-gateway:
    build: {context: ., dockerfile: services/api-gateway/Dockerfile}
    container_name: api-gateway
    ports: ["8080:8080"]
    environment: &svc-common-env
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      SEED_ENABLED: ${SEED_ENABLED}
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  auth-service:
    build: {context: ., dockerfile: services/auth-service/Dockerfile}
    container_name: auth-service
    ports: ["8081:8081"]
    environment:
      <<: *svc-common-env
      PORT: 8081
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Set a generated ORDER_SERVICE_CLIENT_SECRET}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?Set a generated PAYMENT_SERVICE_CLIENT_SECRET}
      CART_SERVICE_CLIENT_SECRET: ${CART_SERVICE_CLIENT_SECRET:?Set a generated CART_SERVICE_CLIENT_SECRET}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_DB_NAME: ${APP_DB_NAME}
      ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_ADMIN_DISPLAY_NAME: ${AUTH_ADMIN_DISPLAY_NAME}
      SECURE_COOKIES: ${SECURE_COOKIES}
      AUTH_RSA_PRIVATE_KEY_LOCATION: ${AUTH_RSA_PRIVATE_KEY_LOCATION}
      AUTH_RSA_PUBLIC_KEY_LOCATION: ${AUTH_RSA_PUBLIC_KEY_LOCATION}
      AUTH_RSA_KID: ${AUTH_RSA_KID}
      AUTH_RSA_PREVIOUS_PUBLIC_KEY_LOCATION: ${AUTH_RSA_PREVIOUS_PUBLIC_KEY_LOCATION}
      AUTH_RSA_PREVIOUS_KID: ${AUTH_RSA_PREVIOUS_KID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    secrets:
      - auth-private.pem
      - auth-public.pem
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  product-service:
    build: {context: ., dockerfile: services/product-service/Dockerfile}
    container_name: product-service
    ports: ["8082:8082"]
    environment:
      <<: *svc-common-env
      PORT: 8082
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  inventory-service:
    build: {context: ., dockerfile: services/inventory-service/Dockerfile}
    container_name: inventory-service
    ports: ["8083:8083"]
    environment:
      <<: *svc-common-env
      PORT: 8083
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  order-service:
    build: {context: ., dockerfile: services/order-service/Dockerfile}
    container_name: order-service
    ports: ["8084:8084"]
    environment:
      <<: *svc-common-env
      PORT: 8084
      SERVICE_AUTH_TOKEN_URI: ${SERVICE_AUTH_TOKEN_URI:-http://auth-service:8081/api/auth/token}
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Set a generated ORDER_SERVICE_CLIENT_SECRET}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  payment-service:
    build: {context: ., dockerfile: services/payment-service/Dockerfile}
    container_name: payment-service
    ports: ["8085:8085"]
    environment:
      <<: *svc-common-env
      PORT: 8085
      SERVICE_AUTH_TOKEN_URI: ${SERVICE_AUTH_TOKEN_URI:-http://auth-service:8081/api/auth/token}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?Set a generated PAYMENT_SERVICE_CLIENT_SECRET}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  notification-service:
    build: {context: ., dockerfile: services/notification-service/Dockerfile}
    container_name: notification-service
    ports: ["8086:8086"]
    environment:
      <<: *svc-common-env
      PORT: 8086
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      WAREHOUSE_EMAIL: ${WAREHOUSE_EMAIL}
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  cart-service:
    build: {context: ., dockerfile: services/cart-service/Dockerfile}
    container_name: cart-service
    ports: ["8087:8087"]
    environment:
      <<: *svc-common-env
      PORT: 8087
      SERVICE_AUTH_TOKEN_URI: ${SERVICE_AUTH_TOKEN_URI:-http://auth-service:8081/api/auth/token}
      CART_SERVICE_CLIENT_SECRET: ${CART_SERVICE_CLIENT_SECRET:?Set a generated CART_SERVICE_CLIENT_SECRET}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
    depends_on:
      mongodb: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  coupon-service:
    build: {context: ., dockerfile: services/coupon-service/Dockerfile}
    container_name: coupon-service
    ports: ["8088:8088"]
    environment:
      <<: *svc-common-env
      PORT: 8088
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_DB_NAME: ${APP_DB_NAME}
    depends_on:
      postgres: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # ---------- Frontend Application ----------
  frontend:
    build:
      context: .
      dockerfile: frontend/ecommerce-app/Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-}
    container_name: frontend-app
    ports:
      - "5173:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    depends_on:
      api-gateway: {condition: service_healthy}
    networks:
      - ecommerce-network

  # ---------- Observability stack (lightweight) ----------
  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      # FIX: added -O /dev/null so wget doesn't write to stdout and exits cleanly
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.14@sha256:ebe075cd4c4520f9d3af2403a1ddc830651ca7d009cbdfdcf21032db574dc3a7
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      # FIX: added -O /dev/null for consistent wget behaviour
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    container_name: loki
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    networks:
      - ecommerce-network
    # The upstream image is distroless and has no shell or HTTP client. Its
    # readiness endpoint remains available at http://localhost:3100/ready for
    # host-side monitoring.

  tempo:
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    networks:
      - ecommerce-network
    # The upstream image is distroless and has no shell or HTTP client. Its
    # readiness endpoint remains available at http://localhost:3200/ready for
    # host-side monitoring.

secrets:
  auth-private.pem:
    file: ./.secrets/keys/private.pem
  auth-public.pem:
    file: ./.secrets/keys/public.pem

volumes:
  postgres_data:
  mongo_data:
  elasticsearch_data:
  grafana_data:
  tempo_data:
  kafka_data:

networks:
  ecommerce-network:
    driver: bridge
