version: "3.9"

# ============================================================================
# Local development stack. Pulls credentials from ../.env (copy from .env.example).
# Bring up: `make up` from the repo root, or `docker compose --env-file ../.env up`.
# ============================================================================

x-shared-network: &shared-network
  networks:
    - ecommerce-network

services:
  # ---------- Datastores ----------
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0@sha256:4b5bf3c2bb7516164f6dcb44acce4fdcb428abfe5771a1128304a0f34ab9ff7c
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    <<: *shared-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok || quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["6379:6379"]
    <<: *shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0@sha256:076ffdc200a51895a220a3c5f4692c73bd6d192ad6bd8db641ded4d2114c7e7b
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------- Messaging ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.6@sha256:d3294ad2b353ac5a155ad9abe37884f75c482f387af553679210303b7118a0d3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.9.6@sha256:9e178783dba8cf44cd8b1d260f548a587a21235921957edd4ed7aa7d060b0852
    container_name: kafka
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["9092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    <<: *shared-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.9.6@sha256:9e178783dba8cf44cd8b1d260f548a587a21235921957edd4ed7aa7d060b0852
    container_name: kafka-init
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint:
      - bash
      - -c
      - |
        for topic in user-events product-events order-events inventory-events \
                     payment-events notification-events cart-events review-events \
                     coupon-events shipping-events audit-events; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
          # DLT for poison-pill messages
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic.DLT" --partitions 3 --replication-factor 1
        done
        echo "Kafka topics ready"
    <<: *shared-network

  # ---------- Mail (dev SMTP catcher) ----------
  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: mailhog
    ports:
      - "1025:1025"      # SMTP
      - "8025:8025"      # Web UI: http://localhost:8025
    <<: *shared-network

  # ---------- Platform infra services ----------
  discovery-server:
    build: {context: .., dockerfile: services/discovery-server/Dockerfile}
    container_name: discovery-server
    ports: ["8761:8761"]
    <<: *shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build: {context: .., dockerfile: services/config-server/Dockerfile}
    container_name: config-server
    ports: ["8888:8888"]
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
    depends_on:
      discovery-server: {condition: service_healthy}
    volumes:
      - ../config-repo:/config-repo:ro
    <<: *shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    build: {context: .., dockerfile: services/api-gateway/Dockerfile}
    container_name: api-gateway
    ports: ["8080:8080"]
    environment: &svc-common-env
      SPRING_PROFILES_ACTIVE: docker
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      redis: {condition: service_healthy}
    <<: *shared-network

  auth-service:
    build: {context: .., dockerfile: services/auth-service/Dockerfile}
    container_name: auth-service
    ports: ["8081:8081"]
    environment:
      <<: *svc-common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_RSA_PRIVATE_KEY_LOCATION: ${AUTH_RSA_PRIVATE_KEY_LOCATION}
      AUTH_RSA_PUBLIC_KEY_LOCATION: ${AUTH_RSA_PUBLIC_KEY_LOCATION}
      AUTH_RSA_KID: ${AUTH_RSA_KID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    secrets:
      - auth-private.pem
      - auth-public.pem
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  product-service:
    build: {context: .., dockerfile: services/product-service/Dockerfile}
    container_name: product-service
    ports: ["8082:8082"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  inventory-service:
    build: {context: .., dockerfile: services/inventory-service/Dockerfile}
    container_name: inventory-service
    ports: ["8083:8083"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  order-service:
    build: {context: .., dockerfile: services/order-service/Dockerfile}
    container_name: order-service
    ports: ["8084:8084"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  payment-service:
    build: {context: .., dockerfile: services/payment-service/Dockerfile}
    container_name: payment-service
    ports: ["8085:8085"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  notification-service:
    build: {context: .., dockerfile: services/notification-service/Dockerfile}
    container_name: notification-service
    ports: ["8086:8086"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      mailhog: {condition: service_started}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  cart-service:
    build: {context: .., dockerfile: services/cart-service/Dockerfile}
    container_name: cart-service
    ports: ["8087:8087"]
    environment:
      <<: *svc-common-env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongodb: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  coupon-service:
    build: {context: .., dockerfile: services/coupon-service/Dockerfile}
    container_name: coupon-service
    ports: ["8088:8088"]
    environment:
      <<: *svc-common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    depends_on:
      postgres: {condition: service_healthy}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    <<: *shared-network

  # ---------- Observability stack (lightweight) ----------
  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    <<: *shared-network
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.14@sha256:ebe075cd4c4520f9d3af2403a1ddc830651ca7d009cbdfdcf21032db574dc3a7
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    <<: *shared-network
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    container_name: loki
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    <<: *shared-network
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tempo:
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    <<: *shared-network
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  auth-private.pem:
    file: ../.secrets/keys/private.pem
  auth-public.pem:
    file: ../.secrets/keys/public.pem

volumes:
  postgres_data:
  mongo_data:
  elasticsearch_data:
  grafana_data:

networks:
  ecommerce-network:
    driver: bridge
