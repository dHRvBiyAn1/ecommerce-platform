---
openapi: 3.0.1
info:
  title: Inventory Service API
  description: Inventory availability, stock management, and order reservation API
  version: 1.0.0
  contact:
    name: Ecommerce Platform maintainers
servers:
- url: http://localhost:8083
  description: Direct service endpoint
- url: http://localhost:8080
  description: API gateway endpoint
tags:
- name: Inventory
  description: Stock availability and reservation operations
paths:
  "/api/v1/inventory":
    get:
      operationId: listInventory
      x-spring-paginated: true
      summary: List inventory
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Inventory page returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PageInventoryResponse"
      description: 'Requires a validated JWT. Authorization: inventory:read permission,
        ADMIN role, or SELLER role.'
      parameters:
      - name: page
        in: query
        required: false
        description: Zero-based page index.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Maximum number of results per page.
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
      - name: sort
        in: query
        required: false
        description: Sort property and direction; Spring defaults to createdAt,desc.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default:
          - createdAt,desc
      security:
      - bearerAuth: []
    post:
      operationId: createInventory
      summary: Create inventory
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '201':
          description: Inventory created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '409':
          "$ref": "#/components/responses/ConflictError"
      description: 'Requires a validated JWT. Authorization: inventory:write permission.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InventoryRequest"
      security:
      - bearerAuth: []
  "/api/v1/inventory/sku/{sku}":
    get:
      operationId: getInventoryBySku
      summary: Get inventory by SKU
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Inventory returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: any authenticated principal.'
      parameters:
      - name: sku
        in: path
        required: true
        description: Stock keeping unit.
        schema:
          type: string
      security:
      - bearerAuth: []
  "/api/v1/inventory/low-stock":
    get:
      operationId: listLowStockInventory
      summary: List low-stock inventory
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Low-stock inventory returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponseList"
      description: 'Requires a validated JWT. Authorization: ADMIN role or SELLER
        role.'
      security:
      - bearerAuth: []
  "/api/v1/inventory/{id}":
    get:
      operationId: getInventoryByProduct
      summary: Get inventory by product
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Inventory returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: any authenticated principal.'
      parameters:
      - name: id
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
    put:
      operationId: updateInventory
      summary: Update inventory
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Inventory updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: inventory:write permission.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InventoryRequest"
      parameters:
      - name: id
        in: path
        required: true
        description: Inventory record identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
    delete:
      operationId: deleteInventory
      summary: Delete inventory
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '204':
          description: Inventory deleted
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: ADMIN role only.'
      parameters:
      - name: id
        in: path
        required: true
        description: Inventory record identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
  "/api/v1/inventory/{productId}/add-stock":
    post:
      operationId: addStock
      summary: Add stock
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Stock quantity increased
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: inventory:write permission.'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      - name: quantity
        in: query
        required: true
        description: Positive number of units to add.
        schema:
          type: integer
          format: int32
          minimum: 1
      security:
      - bearerAuth: []
  "/api/v1/inventory/{productId}/reserve":
    post:
      operationId: reserveStock
      summary: Reserve stock for an order
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Stock reserved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '409':
          "$ref": "#/components/responses/ConflictError"
      description: 'Requires a validated JWT. Authorization: service token with inventory.write
        scope (SCOPE_inventory.write).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StockReservationRequest"
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
  "/api/v1/inventory/{productId}/commit":
    post:
      operationId: commitStock
      summary: Commit reserved stock after payment
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Reserved stock committed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: service token with inventory.write
        scope (SCOPE_inventory.write).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StockReservationRequest"
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
  "/api/v1/inventory/{productId}/release":
    post:
      operationId: releaseStock
      summary: Release an order stock reservation
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Stock reservation released
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InventoryResponse"
        '400':
          "$ref": "#/components/responses/ValidationError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
      description: 'Requires a validated JWT. Authorization: service token with inventory.write
        scope (SCOPE_inventory.write).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StockReservationRequest"
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      security:
      - bearerAuth: []
  "/api/v1/inventory/{productId}/check":
    get:
      operationId: checkStockAvailability
      summary: Check stock availability
      tags:
      - Inventory
      responses:
        '401':
          description: Bearer authentication is required
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '200':
          description: Availability result returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BooleanResult"
      description: 'Requires a validated JWT. Authorization: any authenticated principal.'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
      - name: quantity
        in: query
        required: true
        description: Requested number of units.
        schema:
          type: integer
          format: int32
      security:
      - bearerAuth: []
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        code:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - status
      description: Structured error body returned by the service
    InventoryRequest:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          x-not-null-message: Product ID is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Product ID is required")'
          x-size-message: Product ID must not exceed 64 characters
          x-pattern-message: Product ID contains unsupported characters
          description: Product identifier.
        sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          x-not-null-message: SKU is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "SKU is required")'
          x-size-message: SKU must not exceed 64 characters
          x-pattern-message: SKU contains unsupported characters
          description: Stock keeping unit.
        quantity:
          type: integer
          format: int32
          minimum: 0
          x-minimum-message: Quantity must be zero or positive
          description: On-hand quantity.
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0
          x-minimum-message: Low stock threshold must be zero or positive
          description: Threshold used by the low-stock listing.
        location:
          type: string
          nullable: true
          maxLength: 128
          x-size-message: Location must not exceed 128 characters
      required:
      - productId
      - sku
    StockReservationRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          x-not-null-message: Quantity must be positive
          x-minimum-message: Quantity must be positive
          description: Number of units to reserve, commit, or release.
        orderId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          x-not-null-message: Order ID is required
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Order ID is required")'
          x-size-message: Order ID must not exceed 64 characters
          x-pattern-message: Order ID contains unsupported characters
          description: Order owning the reservation.
      required:
      - quantity
      - orderId
    InventoryResponse:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
        lowStockThreshold:
          type: integer
          format: int32
        location:
          type: string
          nullable: true
        lastRestockedAt:
          type: string
          nullable: true
          format: local-date-time
        createdAt:
          type: string
          format: local-date-time
        updatedAt:
          type: string
          format: local-date-time
      required:
      - id
      - productId
      - sku
      - quantity
      - reservedQuantity
      - availableQuantity
      - lowStockThreshold
      - createdAt
      - updatedAt
    PageInventoryResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            "$ref": "#/components/schemas/InventoryResponse"
        number:
          type: integer
          format: int32
        sort:
          type: object
          properties:
            empty:
              type: boolean
            sorted:
              type: boolean
            unsorted:
              type: boolean
        pageable:
          type: object
          properties:
            offset:
              type: integer
              format: int64
            sort:
              type: object
              properties:
                empty:
                  type: boolean
                sorted:
                  type: boolean
                unsorted:
                  type: boolean
            paged:
              type: boolean
            pageNumber:
              type: integer
              format: int32
            pageSize:
              type: integer
              format: int32
            unpaged:
              type: boolean
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    InventoryResponseList:
      type: array
      items:
        "$ref": "#/components/schemas/InventoryResponse"
    BooleanResult:
      type: boolean
      description: true when the requested quantity is available
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Inventory item was not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The authenticated principal does not have permission for this operation
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Inventory already exists or stock is insufficient
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
