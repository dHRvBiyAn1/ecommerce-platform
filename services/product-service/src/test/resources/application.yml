spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  mongodb:
    representation:
      uuid: java_legacy
    uri: mongodb://root:root@localhost:27017/product_db?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
