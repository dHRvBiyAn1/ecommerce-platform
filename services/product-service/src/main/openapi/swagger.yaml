---
openapi: 3.0.1
info:
  title: Product catalog API
  version: 1.0.0
  description: Public catalog reads and seller/admin catalog management.
  contact:
    name: Ecommerce Platform maintainers
servers:
- url: http://localhost:8082
  description: Local product-service direct access
paths:
  "/api/v1/products/{id}":
    get:
      tags:
      - Products
      summary: Get a public product
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Product is inactive, not approved, or does not exist.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Public product details.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResponse"
      description: Get a public product.
    put:
      tags:
      - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductRequest"
        required: true
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Required role, permission, or resource ownership is missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
      description: Update a product.
    delete:
      tags:
      - Products
      summary: Delete a product
      operationId: deleteProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Resource deleted.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Required role, permission, or resource ownership is missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
      description: Delete a product.
    servers:
    - url: http://localhost:8082
      description: Local product-service direct access
    - url: http://localhost:8080
      description: Local API gateway
