server:
  port: 8082  # unique port for this service

spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://admin:secret@localhost:27017/product_db?authSource=admin
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true

logging:
  level:
    com.project: DEBUG