server:
  port: 8082

spring:
  application:
    name: product-service

  # config:
  #   import: optional:configserver:http://config-server:8888

  # cloud:
  #   config:
  #     discovery:
  #       enabled: true
  #       service-id: config-server

  mongodb:
    uri: mongodb://admin:secret@mongodb:27017/product_db?authSource=admin

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    '[com.project]': DEBUG