          type: string
          x-not-null-message: State/Province is required
          x-field-extra-annotation: '@jakarta.validation.constraints.Pattern(regexp = "[\\s\\S]*[^\\x00-\\x20][\\s\\S]*", message = "State/Province is required")'
          x-size-message: State must not exceed 80 characters
          x-jackson-json-include-policy: ALWAYS
        zipCode:
