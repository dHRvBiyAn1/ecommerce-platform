  "/api/auth/token":
    post:
      tags:
      - Authentication
      summary: Exchange password, refresh cookie, or client credentials for an access
        token
      description: Supports password, refresh_token, and client_credentials grants.
        Request parameters are accepted as query parameters or application/x-www-form-urlencoded
        fields. Password and refresh_token grants return an ApiResponse envelope and
        set the rotating HttpOnly, SameSite=Strict refresh_token cookie; Secure follows
        the service cookie setting; client_credentials returns an OAuth token object
        directly and does not set a refresh cookie.
      operationId: token
      parameters:
      - name: grant_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - password
          - refresh_token
          - client_credentials
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
      - name: password
        in: query
        required: false
        schema:
          type: string
          format: password
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: client_secret
        in: query
        required: false
        schema:
          type: string
          format: password
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Space-delimited allowed scopes.
      - name: Cookie
        in: header
        required: false
        description: Required for the refresh_token grant; send the refresh_token
          cookie set by a previous password or refresh grant.
        schema:
          type: string
      responses:
        '200':
          description: Access token issued. The body schema depends on grant type.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ApiResponseTokenResponse"
                - "$ref": "#/components/schemas/ServiceTokenResponse"
          headers:
            Set-Cookie:
              description: Password and refresh_token grants rotate the HttpOnly,
                SameSite=Strict refresh_token cookie; Secure follows the service cookie
                setting.
              schema:
                type: string
        '400':
          description: Missing/unsupported grant or invalid scope.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/OAuthError"
                - "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid user credentials or client credentials. Password grant
            authentication failures use the standard ErrorResponse; client credential
            errors use OAuthError.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/OAuthError"
                - "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Refresh-token grant failed (expired, invalid, or reused refresh
            token). Password grant authentication failures use the standard ErrorResponse;
            client credential errors use OAuthError.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: "When a Bearer token is present and the revocation blacklist check fails, JwtAuthFilter rejects the request with an empty response."
      requestBody:
        required: false
        description: The same parameters may be submitted in a form body; query parameters
          are also accepted.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - password
                  - refresh_token
                  - client_credentials
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                client_id:
                  type: string
                client_secret:
                  type: string
                  format: password
                  writeOnly: true
                scope:
                  type: string
                  description: Space-delimited scopes.
    servers:
    - url: http://localhost:8081
      description: Local auth-service direct access
    - url: http://localhost:8080
      description: Local API gateway
