openapi: 3.0.1
info:
  title: Authentication and user API
  version: 1.0.0
  description: Authentication, user profiles, seller onboarding, role administration,
    and public signing-key discovery.
  contact:
    name: Ecommerce Platform maintainers
servers:
- url: http://localhost:8081
  description: Local auth-service direct access
