---
openapi: 3.0.1
info:
  title: Order Service API
  version: 1.0.0
  contact:
    name: Ecommerce Platform maintainers
  description: Order creation, checkout, cancellation, and administrative status management.
servers:
- url: http://localhost:8084
  description: Direct service API
- url: http://localhost:8080
  description: API gateway
tags:
- name: Orders
  description: Customer order lifecycle and administrative status management
paths:
  "/api/v1/orders/{orderId}/status":
    put:
      tags:
      - Orders
      summary: Transition an order status as an administrator
      operationId: update_order_status
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderStatusUpdateRequest"
        required: true
      responses:
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponseOrderResponse"
      security:
      - bearerAuth: []
      description: Administrator-only status transition; allowed target states are
        enforced by the order service.
  "/api/v1/orders":
    get:
      tags:
      - Orders
      operationId: get_orders
      x-spring-paginated: true
      parameters:
      - name: page
        in: query
        required: false
        description: Zero-based page index (default 0).
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        description: Page size (default 20).
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: sort
        in: query
        required: false
        description: Sort criteria; repeat for multiple fields (property,direction).
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponsePageOrderResponse"
      security:
      - bearerAuth: []
      summary: get orders
      description: Returns orders owned by the authenticated customer. Administrators
        can list all orders.
    post:
      tags:
      - Orders
      summary: Create or replay an order
      operationId: create_order
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Optional replay key scoped to the authenticated customer; blank
          values are treated as absent. Reuse the same key only for the same logical
          order create request.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderRequest"
        required: true
      responses:
        '201':
          description: Order created or replayed
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ApiResponseOrderResponse"
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
      description: Creates an order for the authenticated customer. The optional idempotency
        key is scoped to that customer; reuse it only to replay the same logical create
        request.
  "/api/v1/orders/{orderId}/cancel":
    post:
      tags:
      - Orders
      operationId: cancel_order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponseOrderResponse"
      security:
      - bearerAuth: []
      summary: cancel order
      description: Cancels an order owned by the authenticated customer; administrators
        may cancel any order.
  "/api/v1/orders/{orderId}":
    get:
      tags:
      - Orders
      summary: Get an owned order
      operationId: get_order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponseOrderResponse"
      security:
      - bearerAuth: []
      description: Returns the order only to its owner or an administrator. Scoped
        service clients with orders.read may read orders for internal workflows.
  "/api/v1/orders/status/{status}":
    get:
      tags:
      - Orders
      operationId: get_orders_by_status
      x-spring-paginated: true
      parameters:
      - name: status
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/OrderStatus"
      - name: page
        in: query
        required: false
        description: Zero-based page index (default 0).
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        description: Page size (default 20).
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: sort
        in: query
        required: false
        description: Sort criteria; repeat for multiple fields (property,direction).
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponsePageOrderResponse"
      security:
      - bearerAuth: []
      summary: get orders by status
      description: Administrator-only order listing filtered by status.
  "/api/v1/orders/number/{orderNumber}":
    get:
      tags:
      - Orders
      operationId: get_order_by_number
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Operation forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponseOrderResponse"
      security:
      - bearerAuth: []
      summary: get order by number
      description: Returns the order only to its owner or an administrator. Scoped
        service clients with orders.read may read orders for internal workflows.
components:
  schemas:
    OrderStatus:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - PROCESSING
      - SHIPPED
      - DELIVERED
      - CANCELLED
      - REFUNDED
    OrderStatusUpdateRequest:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          x-not-null-message: Status is required
          enum:
          - PENDING
          - CONFIRMED
          - PROCESSING
          - SHIPPED
          - DELIVERED
          - CANCELLED
          - REFUNDED
        notes:
          type: string
    ErrorResponse:
      type: object
      required:
      - status
      - error
      - message
      - path
      - code
      - traceId
      - timestamp
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        code:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    BillingAddressRequest:
      required:
      - city
      - country
      - fullName
      - phone
      - street
      - zipCode
      type: object
      properties:
        fullName:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Full name is required")'
          x-not-null-message: Full name is required
        phone:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Phone is required")'
          x-not-null-message: Phone is required
        street:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Street is required")'
          x-not-null-message: Street is required
        city:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "City is required")'
          x-not-null-message: City is required
        state:
          type: string
        zipCode:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Zip code is required")'
          x-not-null-message: Zip code is required
        country:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Country is required")'
          x-not-null-message: Country is required
    OrderItemRequest:
      required:
      - productId
      - quantity
      type: object
      properties:
        productId:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Product ID is required")'
          x-not-null-message: Product ID is required
        quantity:
          minimum: 1
          type: integer
          format: int32
          x-not-null-message: Quantity must be at least 1
          x-minimum-message: Quantity must be at least 1
    OrderRequest:
      required:
      - items
      - paymentMethod
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItemRequest"
          minItems: 1
          x-not-null-message: Order must contain at least one item
          x-size-message: Order must contain at least one item
        couponCode:
          type: string
        shippingAddress:
          "$ref": "#/components/schemas/ShippingAddressRequest"
        billingAddress:
          "$ref": "#/components/schemas/BillingAddressRequest"
        notes:
          type: string
        paymentMethod:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Payment method is required")'
          x-not-null-message: Payment method is required
    ShippingAddressRequest:
      required:
      - city
      - country
      - fullName
      - phone
      - street
      - zipCode
      type: object
      properties:
        fullName:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Full name is required")'
          x-not-null-message: Full name is required
        phone:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Phone is required")'
          x-not-null-message: Phone is required
        street:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Street is required")'
          x-not-null-message: Street is required
        city:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "City is required")'
          x-not-null-message: City is required
        state:
          type: string
        zipCode:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Zip code is required")'
          x-not-null-message: Zip code is required
        country:
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Country is required")'
          x-not-null-message: Country is required
    ApiResponseOrderResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          allOf:
          - "$ref": "#/components/schemas/OrderResponse"
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - status
      - message
      - data
      - timestamp
    BillingAddressResponse:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        phone:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        street:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        city:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        state:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        zipCode:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        country:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
    OrderItemResponse:
      type: object
      properties:
        productId:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        sku:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        productName:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        imageUrl:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        quantity:
          type: integer
          format: int32
          x-jackson-json-include-policy: ALWAYS
        unitPrice:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        discountAmount:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        totalPrice:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
    OrderResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        orderNumber:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        userId:
          type: string
          format: uuid
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        userEmail:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        status:
          type: string
          nullable: true
          enum:
          - PENDING
          - CONFIRMED
          - PROCESSING
          - SHIPPED
          - DELIVERED
          - CANCELLED
          - REFUNDED
          x-jackson-json-include-policy: ALWAYS
        items:
          type: array
          nullable: true
          items:
            "$ref": "#/components/schemas/OrderItemResponse"
          x-jackson-json-include-policy: ALWAYS
        subtotal:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        taxAmount:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        shippingCost:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        discountAmount:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        totalAmount:
          type: number
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        currency:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        shippingAddress:
          allOf:
          - "$ref": "#/components/schemas/ShippingAddressResponse"
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        billingAddress:
          allOf:
          - "$ref": "#/components/schemas/BillingAddressResponse"
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        paymentId:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        paymentMethod:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        paymentStatus:
          type: string
          nullable: true
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          - REFUNDED
          - PARTIALLY_REFUNDED
          x-jackson-json-include-policy: ALWAYS
        couponCode:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        notes:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        createdAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        updatedAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        paidAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        shippedAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        deliveredAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        cancelledAt:
          type: string
          format: local-date-time
          nullable: true
          x-jackson-json-include-policy: ALWAYS
    ShippingAddressResponse:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        phone:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        street:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        city:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        state:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        zipCode:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
        country:
          type: string
          nullable: true
          x-jackson-json-include-policy: ALWAYS
    ApiResponsePageOrderResponse:
      type: object
      required:
      - status
      - message
      - data
      - timestamp
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: object
          nullable: true
          properties:
            content:
              type: array
              items:
                "$ref": "#/components/schemas/OrderResponse"
            pageable:
              type: object
            totalPages:
              type: integer
              format: int32
            totalElements:
              type: integer
              format: int64
            last:
              type: boolean
            size:
              type: integer
              format: int32
            number:
              type: integer
              format: int32
            sort:
              type: object
            numberOfElements:
              type: integer
              format: int32
            first:
              type: boolean
            empty:
              type: boolean
          x-jackson-json-include-policy: ALWAYS
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
