server:
  port: 8081
  
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres:5432/ecommerce
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  secret: ${JWT_SECRET:mySecretKeyWithAtLeast32CharactersLongForHS512!}
  access-token-expiration: 900000      # 15 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    '[com.project]': DEBUG