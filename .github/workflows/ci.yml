name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # This outputs a JSON array of only the services that actually changed
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Automatically creates a 'changes' list output of matched filters
          list-files: json 
          filters: |
            backend:
              - 'pom.xml'
              - 'services/**'
              - 'config-repo/**'
              - 'docker/**'
              - '.mvn/**'
              - 'mvnw'
            auth-service: &shared_backend_paths
              - 'services/auth-service/**'
              - 'services/common/**'
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/common/**'
            config-server:
              - 'services/config-server/**'
            discovery-server:
              - 'services/discovery-server/**'
            product-service:
              - 'services/product-service/**'
              - 'services/common/**'
            inventory-service:
              - 'services/inventory-service/**'
              - 'services/common/**'
            order-service:
              - 'services/order-service/**'
              - 'services/common/**'
            payment-service:
              - 'services/payment-service/**'
              - 'services/common/**'
            notification-service:
              - 'services/notification-service/**'
              - 'services/common/**'
            cart-service:
              - 'services/cart-service/**'
              - 'services/common/**'
            coupon-service:
              - 'services/coupon-service/**'
              - 'services/common/**'
            frontend:
              - 'frontend/ecommerce-app/**'

  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show versions
        run: |
          java -version
          ./mvnw -v

      - name: Compile + package the whole reactor
        run: ./mvnw -B -ntp -DskipTests -T 1C install

      - name: Run tests for the whole reactor
        run: ./mvnw -B -ntp -fae -T 1C verify

      - name: Publish JUnit reports
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: false
          require_tests: false

      - name: Upload jars (for image build job)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          retention-days: 1
          path: |
            services/*/target/*.jar
            !services/*/target/*.original

  images:
    needs: [detect-changes, backend]
    # Evaluate if the dynamic changes array contains any backend services
    # and only triggers runners for modules that actually changed!
    if: |
      needs.detect-changes.outputs.backend == 'true' && 
      fromJson(needs.detect-changes.outputs.changes)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dynamically map the matrix directly to the changed keys from paths-filter
        service: ${{ fromJson(needs.detect-changes.outputs.changes) }}
        # Exclude structural components that aren't deployable docker applications
        exclude:
          - service: backend
          - service: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ecommerce-app/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/ecommerce-app/dist
          retention-days: 7

  sonar:
    needs: [detect-changes, backend]
    if: |
      success() &&
      needs.detect-changes.outputs.backend == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarCloud analysis."
            exit 0
          fi
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=ecommerce-platform \
            -Dsonar.organization=dhrvbiyan1 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN