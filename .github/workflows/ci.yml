name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # This outputs a JSON array of only the services that actually changed
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          # Automatically creates a 'changes' list output of matched filters
          list-files: json 
          filters: |
            backend:
              - 'pom.xml'
              - 'swagger.yaml'
              - '.spectral.yaml'
              - 'scripts/*openapi*'
              - 'scripts/normalize-spectral-json.py'
              - 'scripts/fixtures/openapi/**'
              - 'services/**'
              - 'config-repo/**'
              - 'docker/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.mvn/**'
              - 'mvnw'
              - '.github/workflows/ci.yml'
              - 'scripts/check-jacoco-baseline.sh'
              - 'scripts/check-jacoco-baseline.test.sh'
              - 'scripts/test-active-service-routes.sh'
              - 'scripts/test-common-parent-dockerfiles.sh'
              - 'scripts/test-java21-threading-config.sh'
              - 'scripts/test-sonar-integration.sh'
              - 'scripts/test-sonar-maven-scope.sh'
              - 'scripts/fixtures/SonarScopeCheck.java'
              - 'scripts/fixtures/jacoco/**'
              - 'coverage-baseline/backend-modules.json'
            auth-service: &shared_backend_paths
              - 'services/auth-service/**'
              - 'services/common/**'
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/common/**'
            config-server:
              - 'services/config-server/**'
            discovery-server:
              - 'services/discovery-server/**'
            product-service:
              - 'services/product-service/**'
              - 'services/common/**'
            inventory-service:
              - 'services/inventory-service/**'
              - 'services/common/**'
            order-service:
              - 'services/order-service/**'
              - 'services/common/**'
            payment-service:
              - 'services/payment-service/**'
              - 'services/common/**'
            notification-service:
              - 'services/notification-service/**'
              - 'services/common/**'
            cart-service:
              - 'services/cart-service/**'
              - 'services/common/**'
            coupon-service:
              - 'services/coupon-service/**'
              - 'services/common/**'
            frontend:
              - 'frontend/ecommerce-app/**'

  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node for contract linting
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify OpenAPI contracts and derived documentation
        env:
          OPENAPI_REPORT_DIR: ${{ runner.temp }}/openapi-reports
        run: |
          python3 --version
          bash scripts/test-openapi-contracts.sh

      - name: Show versions
        run: |
          java -version
          ./mvnw -v

      - name: Verify Docker availability for Testcontainers
        run: docker version

      - name: Test backend coverage checker
        run: bash scripts/check-jacoco-baseline.test.sh

      - name: Verify active service routes
        run: bash scripts/test-active-service-routes.sh

      - name: Verify Java 21 threading configuration
        run: bash scripts/test-java21-threading-config.sh

      - name: Verify Java 21 service Dockerfiles
        run: bash scripts/test-common-parent-dockerfiles.sh

      - name: Verify Sonar integration contract
        run: bash scripts/test-sonar-integration.sh

      - name: Verify environment and release smoke checks
        run: bash scripts/smoke-release.test.sh

      - name: Verify formatting and the whole reactor
        run: ./mvnw -B -ntp -fae clean verify

      - name: Verify generated runtime artifact boundaries
        run: python3 scripts/check-openapi-artifacts.py

      - name: Check backend coverage baseline
        run: bash scripts/check-jacoco-baseline.sh coverage-baseline/backend-modules.json

      - name: Verify explicit Mongo integration suites
        run: |
          PRODUCT_MONGO_INTEGRATION=true ./mvnw -B -ntp -pl services/product-service -am verify
          ./mvnw -B -ntp -pl services/cart-service -am verify -Dcart.mongo.integration=true
          ./mvnw -B -ntp -pl services/notification-service -am verify -Dnotification.mongo.integration=true

      - name: Upload OpenAPI diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-contract-diagnostics
          retention-days: 7
          path: |
            ${{ runner.temp }}/openapi-reports/*
            services/*/target/surefire-reports/*
            services/*/target/failsafe-reports/*

      - name: Upload backend JaCoCo reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco-xml
          retention-days: 7
          path: services/*/target/site/jacoco/jacoco.xml

      - name: Publish JUnit reports
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: false
          require_tests: false

      - name: Upload jars (for image build job)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jars
          retention-days: 1
          path: |
            services/*/target/*.jar
            !services/*/target/*.original

  images:
    needs: [detect-changes, backend]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - cart-service
          - coupon-service
          - config-server
          - discovery-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download backend jars
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-jars
          path: services/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ecommerce-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ecommerce-app/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chrome for Playwright
        run: ./node_modules/.bin/playwright install --with-deps chrome
      - name: React quality
        run: npm run react:quality
      - name: Prepare module-relative Sonar coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("coverage/lcov.info").read_text()
          paths = re.findall(r"^SF:(.*)$", source, flags=re.MULTILINE)
          if not paths or any(not path.startswith("src/") for path in paths):
              raise SystemExit("Expected frontend-relative LCOV source paths")
          # The LCOV sensor resolves paths against the frontend Maven module.
          Path("coverage/sonar-lcov.info").write_text(source)
          PY
      - name: Upload frontend Sonar coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sonar-lcov
          retention-days: 7
          path: frontend/ecommerce-app/coverage/sonar-lcov.info
          if-no-files-found: error
      - name: Build frontend distribution
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/ecommerce-app/dist
          retention-days: 7

  sonar:
    needs: [backend, frontend]
    if: |
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Validate Sonar authentication and analysis mode
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          token = os.environ.get("SONAR_TOKEN")
          if not token:
              raise SystemExit("::error::Configure a current SONAR_TOKEN repository secret")
          def get(endpoint):
              request = urllib.request.Request("https://sonarcloud.io/api/" + endpoint,
                                               headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit("::error::Sonar authentication/setup returned HTTP " + str(error.code))
          if get("authentication/validate").get("valid") is not True:
              raise SystemExit("::error::SONAR_TOKEN is invalid; replace it with an authorized personal token")
          project = ET.parse("pom.xml").getroot().findtext("{*}properties/{*}sonar.projectKey")
          settings = get("settings/values?" + urllib.parse.urlencode(
              {"component": project, "keys": "sonar.autoscan.enabled"}))["settings"]
          automatic = next((setting.get("value") for setting in settings
                            if setting.get("key") == "sonar.autoscan.enabled"), None)
          if automatic == "true":
              raise SystemExit("::error::Disable Automatic Analysis in the Sonar project's Analysis Method settings before CI analysis")
          if automatic != "false":
              raise SystemExit("::error::Unable to confirm Sonar Automatic Analysis is disabled")
          PY
      - name: Download verified backend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-jacoco-xml
          path: services
      - name: Download verified frontend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-sonar-lcov
          path: frontend/ecommerce-app/coverage
      - name: Build bytecode and analyze Sonar quality gate
        id: analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          bash scripts/test-sonar-maven-scope.sh
          ./mvnw -B -ntp -Psonar-analysis \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.java.jdkHome="$JAVA_HOME" \
            -Dsonar.qualitygate.wait=true
      - name: Diagnose failed Sonar analysis
        if: failure() && steps.analysis.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          report = Path("target/sonar/report-task.txt")
          if not report.is_file():
              print("No scanner task report; failure occurred before upload")
              raise SystemExit(0)
          metadata = dict(line.split("=", 1) for line in report.read_text().splitlines() if "=" in line)
          task_id = metadata.get("ceTaskId", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", task_id):
              print("Invalid scanner task identifier")
              raise SystemExit(0)
          token = os.environ.get("SONAR_TOKEN")
          if not token:
              print("Sonar diagnostic credential unavailable")
              raise SystemExit(0)
          def get(endpoint, label):
              request = urllib.request.Request("https://sonarcloud.io/api/" + endpoint,
                                               headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print("Sonar " + label + " returned HTTP " + str(error.code))
              except (urllib.error.URLError, TimeoutError):
                  print("Sonar " + label + " request unavailable")
              except ValueError:
                  print("Sonar " + label + " invalid response")
              return {}
          task = get("ce/task?" + urllib.parse.urlencode({"id": task_id}), "background task").get("task", {})
          status = task.get("status")
          print("Sonar background task status:", status if status in ("SUCCESS", "FAILED", "CANCELED", "PENDING", "IN_PROGRESS") else "UNKNOWN")
          if task.get("errorMessage"):
              print("Sonar processing error:", json.dumps(str(task["errorMessage"]).replace(token, "[REDACTED]")))
          if task.get("analysisId"):
              gate = get("qualitygates/project_status?" + urllib.parse.urlencode(
                  {"analysisId": task["analysisId"]}), "quality gate").get("projectStatus", {})
              status = gate.get("status")
              print("Sonar quality gate status:", status if status in ("OK", "ERROR", "WARN", "NONE") else "UNKNOWN")
          PY
