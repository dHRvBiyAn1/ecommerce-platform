name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U root; do sleep 1; done
        env:
          PGPASSWORD: root

      # - name: Build hello-world service
      #   working-directory: ./services/hello-world
      #   run: mvn clean verify

      - name: Build config-server
        working-directory: ./services/config-server
        run: mvn clean verify

      - name: Build discovery-server
        working-directory: ./services/discovery-server
        run: mvn clean verify

      - name: Build user-service
        working-directory: ./services/user-service
        run: mvn clean verify

      # In the future, add similar steps for other services
      # - name: Build and test frontend
      #   working-directory: ./frontend
      #   run: |
      #     npm install
      #     npm run test:ci  # placeholder; you'll add tests later