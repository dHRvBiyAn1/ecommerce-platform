name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  # ---------------------------------------------------------------
  # Detect what actually changed in this PR / push so we can skip
  # cold paths. Backend builds the whole reactor regardless (cheap
  # and avoids cross-module breakage going undetected); the frontend
  # job only fires when frontend files change.
  # ---------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      config-server: ${{ steps.filter.outputs.config-server }}
      discovery-server: ${{ steps.filter.outputs.discovery-server }}
      product-service: ${{ steps.filter.outputs.product-service }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'services/**'
              - 'config-repo/**'
              - 'docker/**'
              - '.mvn/**'
              - 'mvnw'
            auth-service:
              - 'services/auth-service/**'
              - 'services/common/**'
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/common/**'
            config-server:
              - 'services/config-server/**'
            discovery-server:
              - 'services/discovery-server/**'
            product-service:
              - 'services/product-service/**'
              - 'services/common/**'
            inventory-service:
              - 'services/inventory-service/**'
              - 'services/common/**'
            order-service:
              - 'services/order-service/**'
              - 'services/common/**'
            payment-service:
              - 'services/payment-service/**'
              - 'services/common/**'
            notification-service:
              - 'services/notification-service/**'
              - 'services/common/**'
            frontend:
              - 'frontend/ecommerce-app/**'

  # ---------------------------------------------------------------
  # Single multi-module Maven reactor build. This is the canonical
  # way to build a project where every leaf module depends on
  # `common`: install everything in one shot from the repo root.
  # Per-service `mvn verify` from inside services/<svc>/ does not
  # work because `common` would have to be pre-installed.
  # ---------------------------------------------------------------
  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show versions
        run: |
          java -version
          ./mvnw -v

      - name: Compile + package the whole reactor
        # Skip tests in this step so cross-module compile errors are
        # surfaced fast. `verify` runs in the next step.
        run: ./mvnw -B -ntp -DskipTests -T 1C install

      - name: Run tests for the whole reactor
        # `-fae` keeps going on the first failure so we see every
        # broken module in one CI run.
        run: ./mvnw -B -ntp -fae -T 1C verify

      - name: Publish JUnit reports
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: false
          require_tests: false

      - name: Upload jars (for image build job)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          retention-days: 1
          path: |
            services/*/target/*-1.0.0-SNAPSHOT.jar
            !services/*/target/*.jar.original

  # ---------------------------------------------------------------
  # Docker image build per service that actually changed. Only fires
  # for the matrix entries whose path filter matched. Pushes are not
  # configured yet; flip `push: true` and add a registry step when
  # ready.
  # ---------------------------------------------------------------
  images:
    needs: [detect-changes, backend]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
          - service: config-server
            changed: ${{ needs.detect-changes.outputs.config-server }}
          - service: discovery-server
            changed: ${{ needs.detect-changes.outputs.discovery-server }}
          - service: product-service
            changed: ${{ needs.detect-changes.outputs.product-service }}
          - service: inventory-service
            changed: ${{ needs.detect-changes.outputs.inventory-service }}
          - service: order-service
            changed: ${{ needs.detect-changes.outputs.order-service }}
          - service: payment-service
            changed: ${{ needs.detect-changes.outputs.payment-service }}
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
    steps:
      - if: matrix.changed != 'true'
        run: echo "Skipping ${{ matrix.service }} — no changes."

      - if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - if: matrix.changed == 'true'
        name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services/

      - if: matrix.changed == 'true'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: matrix.changed == 'true'
        name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------
  # Frontend: type-check + production build.
  # ---------------------------------------------------------------
  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ecommerce-app/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/ecommerce-app/dist
          retention-days: 7

  # ---------------------------------------------------------------
  # SonarCloud is optional — only runs on PRs/pushes when the
  # SONAR_TOKEN secret is configured. Failing this job won't fail CI.
  # ---------------------------------------------------------------
  sonar:
    needs: backend
    if: |
      success() &&
      needs.detect-changes.outputs.backend == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarCloud analysis."
            exit 0
          fi
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=ecommerce-platform \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN
