name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # This outputs a JSON array of only the services that actually changed
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Automatically creates a 'changes' list output of matched filters
          list-files: json 
          filters: |
            backend:
              - 'pom.xml'
              - 'services/**'
              - 'config-repo/**'
              - 'docker/**'
              - '.mvn/**'
              - 'mvnw'
              - '.github/workflows/ci.yml'
              - 'scripts/check-jacoco-baseline.sh'
              - 'scripts/check-jacoco-baseline.test.sh'
              - 'scripts/test-active-service-routes.sh'
              - 'scripts/test-sonar-integration.sh'
              - 'scripts/fixtures/jacoco/**'
              - 'coverage-baseline/backend-modules.json'
            auth-service: &shared_backend_paths
              - 'services/auth-service/**'
              - 'services/common/**'
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/common/**'
            config-server:
              - 'services/config-server/**'
            discovery-server:
              - 'services/discovery-server/**'
            product-service:
              - 'services/product-service/**'
              - 'services/common/**'
            inventory-service:
              - 'services/inventory-service/**'
              - 'services/common/**'
            order-service:
              - 'services/order-service/**'
              - 'services/common/**'
            payment-service:
              - 'services/payment-service/**'
              - 'services/common/**'
            notification-service:
              - 'services/notification-service/**'
              - 'services/common/**'
            cart-service:
              - 'services/cart-service/**'
              - 'services/common/**'
            coupon-service:
              - 'services/coupon-service/**'
              - 'services/common/**'
            frontend:
              - 'frontend/ecommerce-app/**'

  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show versions
        run: |
          java -version
          ./mvnw -v

      - name: Verify Docker availability for Testcontainers
        run: docker version

      - name: Test backend coverage checker
        run: bash scripts/check-jacoco-baseline.test.sh

      - name: Verify active service routes
        run: bash scripts/test-active-service-routes.sh

      - name: Verify Sonar integration contract
        run: bash scripts/test-sonar-integration.sh

      - name: Verify the whole reactor
        run: ./mvnw -B -ntp -fae clean verify

      - name: Check backend coverage baseline
        run: bash scripts/check-jacoco-baseline.sh coverage-baseline/backend-modules.json

      - name: Upload backend JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-xml
          retention-days: 7
          path: services/*/target/site/jacoco/jacoco.xml

      - name: Publish JUnit reports
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: false
          require_tests: false

      - name: Upload jars (for image build job)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          retention-days: 1
          path: |
            services/*/target/*.jar
            !services/*/target/*.original

  images:
    needs: [detect-changes, backend]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - cart-service
          - coupon-service
    steps:
      - uses: actions/checkout@v4

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ecommerce-app/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: React quality
        run: npm run react:quality
      - name: Prepare repository-rooted Sonar coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("coverage/lcov.info").read_text()
          paths = re.findall(r"^SF:(.*)$", source, flags=re.MULTILINE)
          if not paths or any(not path.startswith("src/") for path in paths):
              raise SystemExit("Expected frontend-relative LCOV source paths")
          Path("coverage/sonar-lcov.info").write_text(
              re.sub(r"^SF:src/", "SF:frontend/ecommerce-app/src/", source, flags=re.MULTILINE))
          PY
      - name: Upload frontend Sonar coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sonar-lcov
          retention-days: 7
          path: frontend/ecommerce-app/coverage/sonar-lcov.info
          if-no-files-found: error
      - name: Build frontend distribution
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/ecommerce-app/dist
          retention-days: 7

  sonar:
    needs: [backend, frontend]
    if: |
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Validate Sonar authentication and analysis mode
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          token = os.environ.get("SONAR_TOKEN")
          if not token:
              raise SystemExit("::error::Configure a current SONAR_TOKEN repository secret")
          def get(endpoint):
              request = urllib.request.Request("https://sonarcloud.io/api/" + endpoint,
                                               headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit("::error::Sonar authentication/setup returned HTTP " + str(error.code))
          if get("authentication/validate").get("valid") is not True:
              raise SystemExit("::error::SONAR_TOKEN is invalid; replace it with an authorized personal token")
          project = ET.parse("pom.xml").getroot().findtext("{*}properties/{*}sonar.projectKey")
          settings = get("settings/values?" + urllib.parse.urlencode(
              {"component": project, "keys": "sonar.autoscan.enabled"}))["settings"]
          automatic = next((setting.get("value") for setting in settings
                            if setting.get("key") == "sonar.autoscan.enabled"), None)
          if automatic == "true":
              raise SystemExit("::error::Disable Automatic Analysis in the Sonar project's Analysis Method settings before CI analysis")
          if automatic != "false":
              raise SystemExit("::error::Unable to confirm Sonar Automatic Analysis is disabled")
          PY
      - name: Download verified backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco-xml
          path: services
      - name: Download verified frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-sonar-lcov
          path: frontend/ecommerce-app/coverage
      - name: Build bytecode and analyze Sonar quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B -ntp -DskipTests install
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.java.jdkHome="$JAVA_HOME"
          -Dsonar.qualitygate.wait=true
