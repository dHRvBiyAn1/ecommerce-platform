server:
  port: 8087

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/cart_db?authSource=admin
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

# Disable common's auto resource-server config; cart-service does it locally.
common:
  security:
    resource-server:
      enabled: false

service:
  auth:
    enabled: true
    token-uri: ${SERVICE_AUTH_TOKEN_URI:http://auth-service:8081/api/auth/token}
    client-id: cart-service
    client-secret: ${CART_SERVICE_CLIENT_SECRET:}
    scope: coupons.read

logging:
  level:
    com.project.cart: INFO
