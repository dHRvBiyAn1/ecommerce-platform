server:
  port: 8087

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:ecommerce}:${MONGO_INITDB_ROOT_PASSWORD:change_me_mongo}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/cart_db?authSource=admin
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://auth-service:8081/.well-known/jwks.json}

# Disable common's auto resource-server config; cart-service does it locally.
common:
  security:
    resource-server:
      enabled: false

logging:
  level:
    com.project.cart: INFO
