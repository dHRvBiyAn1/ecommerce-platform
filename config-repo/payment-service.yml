server:
  port: 8085

spring:
  mongodb:
    representation:
      uuid: java_legacy
    uri: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/payment_db?authSource=admin
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

# In-house webhook signing only (/api/v1/payments/webhook).
# Stripe deliveries to /api/v1/payments/webhook/stripe use stripe.webhook-secret below.
payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET}
    tolerance-seconds: 300

# Stripe PaymentIntents are enabled when STRIPE_SECRET_KEY is non-empty; otherwise
# SandboxGateway supplies a synthetic intent for local server-side testing. Its
# synthetic clientSecret is not usable by Stripe.js and is never a Stripe credential.
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

common:
  security:
    resource-server:
      enabled: false

service:
  auth:
    enabled: true
    token-uri: ${SERVICE_AUTH_TOKEN_URI:http://auth-service:8081/api/auth/token}
    client-id: payment-service
    client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET:}
    scope: orders.read

logging:
  level:
    com.project.payment: INFO
