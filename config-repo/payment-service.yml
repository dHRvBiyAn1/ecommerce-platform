server:
  port: 8085

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/payment_db?authSource=admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

# Webhook signing
payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET}
    tolerance-seconds: 300

# Stripe; if STRIPE_SECRET_KEY is empty, SandboxGateway is used.
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

common:
  security:
    resource-server:
      enabled: false

logging:
  level:
    com.project.payment: INFO
