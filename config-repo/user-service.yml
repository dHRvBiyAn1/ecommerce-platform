server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ecommerce
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  secret: ${JWT_SECRET:mySecretKeyWithAtLeast32CharactersLongForHS512!}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000