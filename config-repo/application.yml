# Defaults applied to every service that fetches from this config-server.
# Per-service files (auth-service.yml, product-service.yml, ...) override.

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Sample-data seeders: each service runs its DataInitializer on startup
# only when both `seed.enabled=true` AND its target collection/table is empty.
# Default true for dev; flip to false in production via env.
seed:
  enabled: ${SEED_ENABLED}

logging:
  level:
    com.project: INFO
    org.springframework.cloud.config: INFO
    org.springframework.cloud.netflix.eureka: WARN

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 75
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - feign.RetryableException
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 20
        maxWaitDuration: 200ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
