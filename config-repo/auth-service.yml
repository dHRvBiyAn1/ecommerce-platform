server:
  port: 8081
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

# OAuth2 social-login providers. Configured programmatically by OAuth2ClientConfig
# only when both -client-id and -client-secret are set. Leaving these empty
# disables social login cleanly (no startup-time validation failure).
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}

# JWT signing
jwt:
  access-token-expiration: 900000        # 15 min
  refresh-token-expiration: 604800000   # 7 days
  issuer: auth-service

# RSA keys (loaded by KeyManager); paths are URI-style (file:, classpath:, etc).
rsa:
  private-key-location: ${AUTH_RSA_PRIVATE_KEY_LOCATION}
  public-key-location: ${AUTH_RSA_PUBLIC_KEY_LOCATION}
  kid: ${AUTH_RSA_KID}
  previous-public-key-location: ${AUTH_RSA_PREVIOUS_PUBLIC_KEY_LOCATION}
  previous-kid: ${AUTH_RSA_PREVIOUS_KID}

# Bootstrap admin (created on first start ONLY if both fields are set)
admin:
  email: ${AUTH_ADMIN_EMAIL}
  password: ${AUTH_ADMIN_PASSWORD}
  display-name: ${AUTH_ADMIN_DISPLAY_NAME}

# Cookie settings — must be true in any non-localhost environment
security:
  cookies:
    secure: ${SECURE_COOKIES}

# Frontend URLs used by OAuth2 success handler / magic links
app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  oauth2-redirect-path: /oauth2/redirect

# Disable the common auto-resource-server config in auth-service: this service
# verifies its own JWTs via JwtAuthFilter against the in-memory KeyManager.
common:
  security:
    resource-server:
      enabled: false

logging:
  level:
    com.project.authservice: INFO
