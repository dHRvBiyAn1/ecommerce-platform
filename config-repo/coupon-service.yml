server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecommerce}
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:change_me_postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Default baseline-version is 1, which would cause V1 to be SKIPPED in a
    # shared database where some other service has already created tables.
    # Setting it to 0 ensures coupon-service's V1 actually runs.
    baseline-version: 0
    locations: classpath:db/migration
    # Coupon-service shares the ecommerce database with auth-service, so it
    # tracks its own migrations in a service-specific history table to avoid
    # checksum collisions on each service's V1.
    table: flyway_schema_history_coupon
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://auth-service:8081/.well-known/jwks.json}

common:
  security:
    resource-server:
      enabled: false

logging:
  level:
    com.project.coupon: INFO
